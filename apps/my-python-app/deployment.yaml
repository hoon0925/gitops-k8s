apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app
    spec:
      containers:
      - name: app
        image: ghcr.io/hoon0925/my-python-app:4500691
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          value: redis-master.redis.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: redis-password-1234
        - name: RABBIT_HOST
          value: rabbitmq.rabbitmq.svc.cluster.local
        - name: RABBIT_USER
          value: admin
        - name: RABBIT_PASSWORD
          value: rabbit-password-1234
        - name: RABBIT_QUEUE
          value: tasks
        - name: APP_VERSION
          value: "v3-rabbitmq"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
